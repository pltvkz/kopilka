<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Копилка — учёт финансов</title>
    <!-- Подключение манифеста PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6c5ce7">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg: #f4f5f9;
            --card: #ffffff;
            --tx: #1b1d2a;
            --mut: #7a7f94;
            --ac: #6c5ce7;
            --inc: #00a37a;
            --exp: #e5484d;
            --ln: #e6e8f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12131c;
                --card: #1e202e;
                --tx: #f4f5f9;
                --mut: #a0a5ba;
                --ln: #2d3045;
            }
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 90px;
        }

        .w {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        select, input, button {
            font-family: inherit;
            color: inherit;
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 8px;
            background: var(--card);
        }

        .hero {
            background: linear-gradient(135deg, var(--ac), #a29bfe);
            color: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 14px;
        }

        .hero small { opacity: .85; display: block; }
        .hero b { font-size: 28px; }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .icon-cell {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            margin-right: 12px;
        }

        .income { color: var(--inc); font-weight: bold; }
        .expense { color: var(--exp); font-weight: bold; }

        nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--card);
            border-top: 1px solid var(--ln);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
            z-index: 5;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--mut);
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-button.active {
            color: var(--ac);
        }

        .fab {
            position: fixed;
            right: max(16px, calc(50% - 244px));
            bottom: calc(74px + env(safe-area-inset-bottom, 0px));
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--ac);
            color: white;
            font-size: 30px;
            border: none;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 6;
        }

        .mod {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 10;
        }

        .sheet {
            background: var(--bg);
            width: 100%;
            max-width: 520px;
            border-radius: 22px 22px 0 0;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .save-button {
            width: 100%;
            padding: 14px;
            background-color: var(--ac);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }

        .empty-text {
            text-align: center;
            margin: 40px 0;
            color: var(--mut);
        }
    </style>
</head>
<body>
    <div class="w">
        <header>
            <h1>🐷 Копилка</h1>
            <select id="cur" onchange="changeCurrency(this.value)">
                <option value="₸">₸</option>
                <option value="₽">₽</option>
                <option value="$">$</option>
                <option value="€">€</option>
                <option value="Br">Br</option>
            </select>
        </header>

        <div id="display-area"></div>
    </div>

    <button class="fab" onclick="openAdd()" title="Добавить">+</button>

    <nav>
        <button class="tab-button" id="tab-acc" onclick="setTab('acc')">Счета</button>
        <button class="tab-button" id="tab-hist" onclick="setTab('hist')">История</button>
    </nav>

    <div class="mod" id="modal-overlay" onclick="closeModal(event)">
        <div class="sheet" id="modal-content" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        let currentTab = 'acc';

        let S = {
            currency: "₸",
            accounts: [
                { id: "1", name: "Наличные", balance: 0, icon: "💵" },
                { id: "2", name: "Карта", balance: 0, icon: "💳" }
            ],
            transactions: []
        };

        // Загрузка данных
        try {
            const savedData = localStorage.getItem("coinkeeper-data");
            if (savedData) S = JSON.parse(savedData);
        } catch (e) {
            console.error("Ошибка загрузки:", e);
        }

        function saveData() {
            localStorage.setItem("coinkeeper-data", JSON.stringify(S));
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat("ru-RU").format(amount) + " " + S.currency;
        }

        function changeCurrency(val) {
            S.currency = val;
            saveData();
            render();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`)?.classList.add('active');
            render();
        }

        function render() {
            document.getElementById('cur').value = S.currency;
            const area = document.getElementById("display-area");

            if (currentTab === 'acc') {
                const total = S.accounts.reduce((sum, acc) => sum + Number(acc.balance), 0);
                area.innerHTML = `
                    <div class="hero">
                        <small>Всего средств</small>
                        <b>${formatCurrency(total)}</b>
                    </div>
                    <div>
                        ${S.accounts.map(acc => `
                            <div class="card-row">
                                <div style="display:flex; align-items:center;">
                                    <div class="icon-cell">${acc.icon}</div>
                                    <strong>${acc.name}</strong>
                                </div>
                                <div class="${acc.balance >= 0 ? 'income' : 'expense'}">
                                    ${formatCurrency(acc.balance)}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTab === 'hist') {
                if (!S.transactions.length) {
                    area.innerHTML = `<div class="empty-text">История транзакций пуста</div>`;
                    return;
                }
                area.innerHTML = S.transactions.slice().reverse().map(t => `
                    <div class="card-row">
                        <div>
                            <strong>${t.category || 'Операция'}</strong>
                            <div style="font-size:12px; color:var(--mut);">${t.date}</div>
                        </div>
                        <div class="${t.type === 'income' ? 'income' : 'expense'}">
                            ${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}
                        </div>
                    </div>
                `).join('');
            }
        }

        function openAdd() {
            const modal = document.getElementById('modal-content');
            modal.innerHTML = `
                <h2>Новая операция</h2>
                <div class="form-group">
                    <label>Тип</label>
                    <select id="txn-type">
                        <option value="expense">Расход</option>
                        <option value="income">Доход</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Счет</label>
                    <select id="txn-acc">
                        ${S.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <input type="text" id="txn-cat" placeholder="Продукты, Зарплата...">
                </div>
                <div class="form-group">
                    <label>Сумма</label>
                    <input type="number" id="txn-amount" placeholder="0">
                </div>
                <button class="save-button" onclick="saveTransaction()">Сохранить</button>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal(e) {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function saveTransaction() {
            const type = document.getElementById('txn-type').value;
            const accId = document.getElementById('txn-acc').value;
            const cat = document.getElementById('txn-cat').value || 'Разное';
            const amount = parseFloat(document.getElementById('txn-amount').value);

            if (!amount || amount <= 0) return alert('Введите корректную сумму');

            const acc = S.accounts.find(a => a.id === accId);
            if (acc) {
                if (type === 'income') acc.balance += amount;
                else acc.balance -= amount;
            }

            S.transactions.push({
                id: Date.now().toString(),
                type,
                accountId: accId,
                category: cat,
                amount,
                date: new Date().toLocaleDateString('ru-RU')
            });

            saveData();
            closeModal();
            render();
        }

        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW зарегистрирован:', reg.scope))
                    .catch(err => console.error('Ошибка SW:', err));
            });
        }

        setTab('acc');
    </script>
</body>
